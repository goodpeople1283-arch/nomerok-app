<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nomerok Mini App</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
            user-select: none;
        }
        body {

            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
            margin-top: 10px;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 10px;
            color: #38bdf8;
        }
        .balance-box {
            font-size: 18px;
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;

            color: #34d399;
            font-weight: bold;
        }

            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background-color: #0ea5e9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

            background-color: #0284c7;
        }

            background-color: #334155;
        }

        }
